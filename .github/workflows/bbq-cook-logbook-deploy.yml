name: Deploy BBQ Cook Logbook

on:
  workflow_dispatch:
    inputs:
      pullRequestNumber:
        description: Merged BBQ pull request whose passing required checks authorize deployment
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: bbq-cook-logbook-deployment-${{ inputs.pullRequestNumber }}
  cancel-in-progress: false

jobs:
  validate-linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      pull_request_number: ${{ steps.validate.outputs.pull_request_number }}
      required_checks: ${{ steps.validate.outputs.required_checks }}
      security_checks: ${{ steps.validate.outputs.security_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate merged pull request and required checks
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pullRequestNumber }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYED_SHA: ${{ github.sha }}
          DEPLOYED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DEPLOYED_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this workflow from main after the BBQ pull request has merged."
            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pullRequestNumber must be a positive integer."
            exit 1
          fi

          pr="$(gh api -H "Accept: application/vnd.github+json" "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          head_repository="$(jq -r '.head.repo.full_name // empty' <<< "$pr")"
          base_ref="$(jq -r '.base.ref // empty' <<< "$pr")"
          merged="$(jq -r '.merged // false' <<< "$pr")"
          merge_sha="$(jq -r '.merge_commit_sha // empty' <<< "$pr")"
          if [ "$head_repository" != "$REPOSITORY" ] || [ "$base_ref" != "main" ] ||
            [ "$merged" != "true" ] || [ -z "$merge_sha" ]; then
            echo "::error::The selected pull request must be merged into main from this repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$merge_sha" "$DEPLOYED_SHA"; then
            echo "::error::The workflow commit does not contain the selected pull request merge."
            exit 1
          fi

          if ! required_checks="$(gh pr checks "$PR_NUMBER" --required --json name,state,workflow,bucket)"; then
            echo "::error::The pull request has required checks that have not passed."
            exit 1
          fi
          if [ "$(jq 'length' <<< "$required_checks")" -eq 0 ] ||
            ! jq -e 'all(.[]; .bucket == "pass")' <<< "$required_checks" >/dev/null; then
            echo "::error::At least one required check must exist and every required check must pass."
            exit 1
          fi

          all_checks="$(gh pr checks "$PR_NUMBER" --json name,state,workflow,bucket)"
          security_checks="$(
            jq -c '
              [.[] | select(
                ((.workflow // "") | test("codeql|dependency review"; "i")) or
                ((.name // "") | test("codeql|dependency review|analyze javascript"; "i"))
              )]
            ' <<< "$all_checks"
          )"
          if [ "$(jq 'length' <<< "$security_checks")" -gt 0 ] &&
            ! jq -e 'all(.[]; .bucket == "pass")' <<< "$security_checks" >/dev/null; then
            echo "::error::An available CodeQL or dependency-review check has not passed."
            exit 1
          fi

          required_summary="$(
            jq -c '{status: "passed", count: length, checks: map({name, workflow, state})}' \
              <<< "$required_checks"
          )"
          security_summary="$(
            jq -c '{
              status: (if length == 0 then "not_run" else "passed" end),
              count: length,
              checks: map({name, workflow, state})
            }' <<< "$security_checks"
          )"
          echo "pull_request_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "required_checks=$required_summary" >> "$GITHUB_OUTPUT"
          echo "security_checks=$security_summary" >> "$GITHUB_OUTPUT"
          {
            echo "## BBQ deployment authorization"
            echo "- Pull request: #$PR_NUMBER (merged into main)"
            echo "- Merge commit: \`$merge_sha\`"
            echo "- Required checks: \`passed\` ($(jq 'length' <<< "$required_checks"))"
            echo "- Available security checks: \`$(jq -r '.status' <<< "$security_summary")\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: validate-linkage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: workshop
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: capstone/bbq-logbook/package-lock.json
      - name: Install and validate the selected commit
        id: validate-app
        working-directory: capstone/bbq-logbook
        run: |
          npm ci
          npm run check
          npm run smoke
      - name: Build deployable application package
        working-directory: capstone/bbq-logbook
        run: |
          zip -qr "$RUNNER_TEMP/bbq-cook-logbook.zip" \
            dist src scripts tsconfig.json package.json package-lock.json
      - name: Validate assigned deployment scope and opt-in
        id: configuration
        shell: bash
        env:
          DEPLOY_ENABLED: ${{ vars.BBQ_COOK_LOGBOOK_DEPLOY_ENABLED }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "::error::Deployment is disabled. Set BBQ_COOK_LOGBOOK_DEPLOY_ENABLED=true in the protected workshop environment only after scope and OIDC readiness are approved."
            exit 1
          fi
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID RESOURCE_GROUP TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing protected workshop environment variable $name; deployment cannot infer the assigned team scope."
              exit 1
            fi
          done
          if ! [[ "$TEAM_ID" =~ ^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]$ ]]; then
            echo "::error::TEAM_ID must be 2-32 lowercase letters, digits, or internal hyphens."
            exit 1
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and validate BBQ infrastructure
        id: infrastructure-validate
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          set -euo pipefail
          az bicep build \
            --file capstone/bbq-logbook/infra/main.bicep \
            --outfile "$RUNNER_TEMP/bbq-cook-logbook-template.json"
          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file capstone/bbq-logbook/infra/main.bicep \
            --parameters "teamIdentifier=$TEAM_ID"
          echo "bicep_build=true" >> "$GITHUB_OUTPUT"
          echo "deployment_validation=true" >> "$GITHUB_OUTPUT"
      - name: Preview changes in the assigned resource group
        id: infrastructure-what-if
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          set -euo pipefail
          az deployment group what-if \
            --name "bbq-cook-logbook-preview-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file capstone/bbq-logbook/infra/main.bicep \
            --parameters "teamIdentifier=$TEAM_ID" \
            --result-format FullResourcePayloads \
            --no-pretty-print
          echo "what_if=true" >> "$GITHUB_OUTPUT"
      - name: Deploy infrastructure to the assigned resource group
        id: infrastructure
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          set -euo pipefail
          deployment="$(
            az deployment group create \
              --name "bbq-cook-logbook-${GITHUB_RUN_ID}" \
              --resource-group "$RESOURCE_GROUP" \
              --template-file capstone/bbq-logbook/infra/main.bicep \
              --parameters "teamIdentifier=$TEAM_ID" \
              --output json
          )"
          app_name="$(jq -r '.properties.outputs.appName.value // empty' <<< "$deployment")"
          app_url="$(jq -r '.properties.outputs.appUrl.value // empty' <<< "$deployment")"
          deployment_name="$(jq -r '.name // empty' <<< "$deployment")"
          if [ -z "$app_name" ] || [ -z "$app_url" ] || [ -z "$deployment_name" ]; then
            echo "::error::The infrastructure deployment did not return the expected App Service outputs."
            exit 1
          fi
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "application_url=${app_url%/}" >> "$GITHUB_OUTPUT"
          echo "deployment_name=$deployment_name" >> "$GITHUB_OUTPUT"
      - name: Deploy the application package
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ steps.infrastructure.outputs.app_name }}
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --src-path "$RUNNER_TEMP/bbq-cook-logbook.zip" \
            --type zip \
            --clean true \
            --restart true
      - name: Verify health, readiness, functional flow, and restart persistence
        id: verify
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.infrastructure.outputs.application_url }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ steps.infrastructure.outputs.app_name }}
        run: |
          set -euo pipefail
          wait_for_ready() {
            for attempt in {1..36}; do
              if curl --fail --silent --show-error "$APPLICATION_URL/health/live" >/dev/null &&
                curl --fail --silent --show-error "$APPLICATION_URL/health/ready" >/dev/null; then
                return 0
              fi
              sleep 10
            done
            echo "::error::Application liveness/readiness did not recover within six minutes."
            return 1
          }

          wait_for_ready
          payload="$(
            jq -c -n \
              --arg meatType "Automated cook ${GITHUB_RUN_ID}" \
              '{
                meatType: $meatType,
                initialWeightKg: 5.4,
                trimmedWeightKg: 4.8,
                seasonings: ["salt", "pepper"],
                preparationSteps: ["Trim fat cap", "Apply rub"],
                cookEvents: [
                  {event: "Start cook", observation: "Smoker at 110 C"},
                  {event: "Wrap", observation: "Bark set"}
                ],
                totalCookMinutes: 420,
                finalObservations: "Tender with a firm bark",
                appearanceRating: 5,
                tasteRating: 4,
                textureRating: 5
              }'
          )"
          created="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$APPLICATION_URL/api/cook-logs"
          )"
          if ! jq -e --argjson expected "$payload" '. == $expected' <<< "$created" >/dev/null; then
            echo "::error::The deployed API did not return the complete submitted Cook Log."
            exit 1
          fi
          browse="$(curl --fail --silent --show-error "$APPLICATION_URL/api/cook-logs")"
          if ! jq -e --argjson expected "$payload" \
            'type == "array" and any(.[]; . == $expected)' <<< "$browse" >/dev/null; then
            echo "::error::The created Cook Log was not available from the browse endpoint."
            exit 1
          fi

          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$APP_NAME"
          wait_for_ready
          after_restart="$(curl --fail --silent --show-error "$APPLICATION_URL/api/cook-logs")"
          if ! jq -e --argjson expected "$payload" \
            'type == "array" and any(.[]; . == $expected)' <<< "$after_restart" >/dev/null; then
            echo "::error::The Cook Log did not survive an App Service restart."
            exit 1
          fi
          echo "liveness=true" >> "$GITHUB_OUTPUT"
          echo "readiness=true" >> "$GITHUB_OUTPUT"
          echo "create_browse=true" >> "$GITHUB_OUTPUT"
          echo "restart_persistence=true" >> "$GITHUB_OUTPUT"
      - name: Create machine-readable deployment evidence
        id: evidence
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.infrastructure.outputs.application_url }}
          AZURE_DEPLOYMENT: ${{ steps.infrastructure.outputs.deployment_name }}
          PR_NUMBER: ${{ needs.validate-linkage.outputs.pull_request_number }}
          REQUIRED_CHECKS: ${{ needs.validate-linkage.outputs.required_checks }}
          SECURITY_CHECKS: ${{ needs.validate-linkage.outputs.security_checks }}
          BICEP_BUILD: ${{ steps.infrastructure-validate.outputs.bicep_build }}
          DEPLOYMENT_VALIDATION: ${{ steps.infrastructure-validate.outputs.deployment_validation }}
          WHAT_IF: ${{ steps.infrastructure-what-if.outputs.what_if }}
          LIVENESS: ${{ steps.verify.outputs.liveness }}
          READINESS: ${{ steps.verify.outputs.readiness }}
          CREATE_BROWSE: ${{ steps.verify.outputs.create_browse }}
          RESTART_PERSISTENCE: ${{ steps.verify.outputs.restart_persistence }}
        run: |
          set -euo pipefail
          jq -c -n \
            --arg commit_sha "$GITHUB_SHA" \
            --argjson pull_request_number "$PR_NUMBER" \
            --argjson required_checks "$REQUIRED_CHECKS" \
            --argjson security_checks "$SECURITY_CHECKS" \
            --arg azure_deployment "$AZURE_DEPLOYMENT" \
            --arg github_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg environment "workshop" \
            --arg application_url "$APPLICATION_URL" \
            --argjson bicep_build "$BICEP_BUILD" \
            --argjson deployment_validation "$DEPLOYMENT_VALIDATION" \
            --argjson what_if "$WHAT_IF" \
            --argjson liveness "$LIVENESS" \
            --argjson readiness "$READINESS" \
            --argjson create_browse "$CREATE_BROWSE" \
            --argjson restart_persistence "$RESTART_PERSISTENCE" \
            '{
              schema_version: 1,
              commit_sha: $commit_sha,
              pull_request_number: $pull_request_number,
              required_checks: $required_checks,
              security_checks: $security_checks,
              azure: {
                deployment_name: $azure_deployment,
                github_run_id: $github_run_id,
                bicep_build: $bicep_build,
                deployment_validation: $deployment_validation,
                what_if: $what_if
              },
              environment: $environment,
              application_url: $application_url,
              verification: {
                liveness: $liveness,
                readiness: $readiness,
                create_browse: $create_browse,
                restart_persistence: $restart_persistence
              },
              workflow_run_url: $workflow_run_url
            }' > "$RUNNER_TEMP/bbq-deployment-evidence.json"
          jq -e '
            .schema_version == 1 and
            (.commit_sha | test("^[0-9a-f]{40}$")) and
            (.pull_request_number > 0) and
            .required_checks.status == "passed" and
            (.security_checks.status == "passed" or .security_checks.status == "not_run") and
            .azure.bicep_build and
            .azure.deployment_validation and
            .azure.what_if and
            (.azure.deployment_name | length > 0) and
            .environment == "workshop" and
            (.application_url | test("^https://")) and
            ([.verification[]] | all) and
            (.workflow_run_url | length > 0)
          ' "$RUNNER_TEMP/bbq-deployment-evidence.json" >/dev/null
      - name: Retain verified deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bbq-cook-logbook-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/bbq-deployment-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish deployment outcome
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          PR_NUMBER: ${{ needs.validate-linkage.outputs.pull_request_number }}
          APP_URL: ${{ steps.infrastructure.outputs.application_url }}
          DEPLOYMENT_NAME: ${{ steps.infrastructure.outputs.deployment_name }}
          VALIDATION_RESULT: ${{ steps.infrastructure-validate.outcome }}
          WHAT_IF_RESULT: ${{ steps.infrastructure-what-if.outcome }}
          DEPLOY_RESULT: ${{ steps.infrastructure.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## BBQ Cook Logbook deployment evidence"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Pull request: #$PR_NUMBER"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Infrastructure validation: \`${VALIDATION_RESULT:-not_run}\`"
            echo "- Infrastructure what-if: \`${WHAT_IF_RESULT:-not_run}\`"
            echo "- Azure deployment: \`${DEPLOY_RESULT:-not_run}\`"
            echo "- Live and restart-persistence verification: \`${VERIFY_RESULT:-not_run}\`"
            echo "- Overall result: \`$JOB_RESULT\`"
            if [ "$JOB_RESULT" = "success" ] && [ -n "$APP_URL" ] && [ -n "$DEPLOYMENT_NAME" ]; then
              echo "- Protected environment: \`workshop\`"
              echo "- Azure deployment ID: \`$DEPLOYMENT_NAME\`"
              echo "- Verified application URL: $APP_URL"
              echo "- Machine-readable deployment evidence artifact retained for 90 days."
            else
              echo "- Deployed URL and deployment ID withheld because the complete deployment and live verification did not succeed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
